# Looptify configuration. Delete any line to use its default.

# Fire the loop this many seconds before the track ends.
# Spotify pushes position updates only every ~4.5s, so Looptify extrapolates
# between pushes; measured accuracy is ~20ms, which makes 1.5s comfortable.
#
# IMPORTANT: if you enable Crossfade in Spotify (Settings > Playback), the next
# track starts BEFORE the current one ends. Raise this above your crossfade
# duration or the loop will fire too late.
lead_seconds = 1.5

# After firing, wait this long before another fire is possible.
cooldown_seconds = 3.0

# ...and also require playback to have restarted below this position.
# Both conditions must hold, which is what prevents a double-fire.
restart_threshold_seconds = 5.0

# If SMTC data is staler than this, treat it as untrustworthy and do nothing.
# Normal staleness peaks around 4.5s.
max_drift_seconds = 10.0

# How often to poll, in seconds.
poll_interval = 0.15

# Global hotkey to arm/disarm. Modifiers: ctrl, alt, shift, win.
hotkey = "ctrl+alt+l"

# What happens just before a song ends:
#   "loop"          restart the same song (the original behaviour)
#   "in_order"      play the next row of the open playlist; after the last, row 1
#   "shuffle_loop"  play a random row not yet played; repeats only once every
#                   row has played
#   "pure_random"   play any row at random, possibly the same song again
# The playlist modes press the row's own play button in Spotify, which, like a
# manual click, avoids the ad. They need Spotify started with extra flags, so
# Looptify restarts Spotify once, the first time a playlist mode is active.
mode = "loop"

# Global hotkey that cycles loop -> in_order -> shuffle_loop -> pure_random.
mode_hotkey = "ctrl+alt+m"

# Start already armed, so opening Looptify immediately loops whatever is
# playing. Set to false if you would rather arm it yourself each time.
start_armed = true

# Show an on-screen notification when you arm or disarm. Since Looptify runs
# in the background, this is usually the only way to tell what state it is in.
show_notifications = true

# How long a notification stays fully visible, in seconds, not counting its
# fade in and fade out. Pressing the hotkey again cuts the wait short: the
# current notification fades away and the new one takes its place.
notification_seconds = 3.0

# --- Ad detection. Two independent rules; either one is enough. ---

# Rule 1: artist names that mean "this is an ad", matched against the ARTIST
# field EXACTLY (case-insensitive). Catches Spotify's own house ads.
#
# Matching is on the artist, not the title, because ad titles vary by campaign
# and language — two captured in one break were 'Dengarkan musik tanpa iklan.'
# and 'Nikmati musik tanpa iklan.' — while the artist stays "Spotify".
# Matching is exact rather than substring so that legitimate releases like
# "Spotify Singles" or "Spotify Sessions" are never muted as ads.
ad_markers = ["Spotify"]

# Rule 2: detect ads by structure instead of by name. Every real Spotify track
# belongs to a release, so it has an album and a track number; ads have
# neither and run short. This is the rule that catches THIRD-PARTY ads, which
# report the advertiser's own brand as the artist and so can never be covered
# by the list above. It is also language- and country-independent.
#
# All three conditions must hold: no album, no track number, and shorter than
# ad_max_duration_seconds.
detect_ads_by_structure = true

# Upper bound on how long an ad can be. Captured ads ran 14-30s. Raising this
# too far risks muting untagged local files; lowering it risks missing long ads.
ad_max_duration_seconds = 60.0

# To turn ad muting off completely, set ad_markers = [] AND
# detect_ads_by_structure = false.

# Log every track change with its full SMTC fields, so you can capture what a
# real ad looks like and fill in ad_markers above.
log_tracks = false
